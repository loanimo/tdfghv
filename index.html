    <!-- Admin Panel Modal -->

    <!-- Application Script -->
    <script>
        let db = {
            currentUser: null,
            users: [
                { phone: "01712345678", pass: "123456", name: "Md Mehedi Hasan", balance: 500.00, bonus: 500.00, turnoverReq: 5000.00, turnoverDone: 0.00, verified: true }
            ],
            transactions: [
                { id: 'TRX9821', type: 'Deposit', amount: 1000, status: 'Success', time: '10:30 AM' },
                { id: 'TRX5542', type: 'Withdraw', amount: 500, status: 'Pending', time: '11:15 AM' }
            ],
            chatMessages: [
                { sender: 'System', text: 'অ্যাডমিন প্যানেলে স্বাগতম।' }
            ],
            agentNumbers: ["01994500030", "01997393758", "01903983899"],
            agentIndex: 0
        };

        if(localStorage.getItem('megaWinFullDB')) {
            try { db = JSON.parse(localStorage.getItem('megaWinFullDB')); } catch(e) {}
        }

        function persistDB() {
            localStorage.setItem('megaWinFullDB', JSON.stringify(db));
            updateHeaderBalance();
        }

        function updateHeaderBalance() {
            if(db.currentUser) {
                const u = db.users.find(x => x.phone === db.currentUser);
                if(u) document.getElementById('headerBalance').innerText = '৳ ' + u.balance.toFixed(2);
            } else {
                document.getElementById('headerBalance').innerText = '৳ 0.00';
            }
        }

        // --- AUTH ---
        function renderAuthScreen(mode = 'login') {
            const container = document.getElementById('authContainer');
            container.classList.remove('hidden');

            if(mode === 'login') {
                container.innerHTML = `
                    <div class="bg-slate-900 border border-slate-700 w-full max-w-sm rounded-2xl p-6 shadow-2xl space-y-4">
                        <div class="text-center">
                            <div class="bg-gradient-to-r from-amber-500 to-rose-600 text-white font-black px-4 py-1.5 rounded-xl text-xl inline-block shadow">MEGA WIN 777</div>
                            <h2 class="text-base font-bold text-slate-200 mt-2">আপনার অ্যাকাউন্টে লগইন করুন</h2>
                        </div>
                        <div class="space-y-3">
                            <div>
                                <label class="text-xs text-slate-400 block mb-1">মোবাইল নম্বর</label>
                                <input type="text" id="loginPhone" placeholder="017XXXXXXXX" class="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-xs w-full outline-none text-white">
                            </div>
                            <div>
                                <label class="text-xs text-slate-400 block mb-1">পাসওয়ার্ড</label>
                                <input type="password" id="loginPass" placeholder="******" class="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-xs w-full outline-none text-white">
                            </div>
                            <button onclick="handleLogin()" class="w-full bg-gradient-to-r from-amber-500 to-rose-600 text-slate-950 font-bold py-3 rounded-xl text-sm shadow">লগইন করুন</button>
                        </div>
                        <div class="flex justify-between text-xs text-slate-400 pt-2 border-t border-slate-800">
                            <button onclick="renderAuthScreen('register')" class="text-amber-400 hover:underline">নতুন অ্যাকাউন্ট খুলুন</button>
                            <button onclick="renderAuthScreen('forgot')" class="hover:text-white">পাসওয়ার্ড ভুলে গেছেন?</button>
                        </div>
                    </div>
                `;
            } else if(mode === 'register') {
                container.innerHTML = `
                    <div class="bg-slate-900 border border-slate-700 w-full max-w-sm rounded-2xl p-6 shadow-2xl space-y-3">
                        <div class="text-center">
                            <h2 class="text-base font-bold text-amber-400">নতুন অ্যাকাউন্ট রেজিস্টার করুন</h2>
                            <p class="text-[10px] text-slate-400">ভেরিফাই করলেই পাবেন ৳৫০০ ওয়েলকাম বোনাস!</p>
                        </div>
                        <div class="space-y-2 text-xs">
                            <input type="text" id="regName" placeholder="পূর্ণ নাম" class="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 w-full outline-none text-white">
                            <input type="text" id="regPhone" placeholder="মোবাইল নম্বর (017XXXXXXXX)" class="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 w-full outline-none text-white">
                            <input type="password" id="regPass" placeholder="পাসওয়ার্ড (কমপক্ষে ৬ ডিজিট)" class="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 w-full outline-none text-white">
                            <button onclick="triggerOTP()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-xl shadow">ওটিপি (OTP) কোড পাঠান</button>
                        </div>
                        <div class="text-center pt-2">
                            <button onclick="renderAuthScreen('login')" class="text-xs text-amber-400 hover:underline">লগইন পেজে ফিরে যান</button>
                        </div>
                    </div>
                `;
            } else if(mode === 'forgot') {
                container.innerHTML = `
                    <div class="bg-slate-900 border border-slate-700 w-full max-w-sm rounded-2xl p-6 shadow-2xl space-y-3">
                        <div class="text-center">
                            <h2 class="text-base font-bold text-rose-500">পাসওয়ার্ড রিসেট করুন</h2>
                        </div>
                        <div class="space-y-2 text-xs">
                            <input type="text" id="forgotPhone" placeholder="আপনার রেজিস্টার্ড মোবাইল নম্বর" class="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 w-full outline-none text-white">
                            <input type="password" id="newPass" placeholder="নতুন পাসওয়ার্ড" class="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 w-full outline-none text-white">
                            <button onclick="executePasswordReset()" class="w-full bg-rose-600 hover:bg-rose-500 text-white font-bold py-2.5 rounded-xl shadow">পাসওয়ার্ড পরিবর্তন করুন</button>
                        </div>
                        <div class="text-center pt-2">
                            <button onclick="renderAuthScreen('login')" class="text-xs text-amber-400 hover:underline">লগইন করুন</button>
                        </div>
                    </div>
                `;
            }
        }

        function handleLogin() {
            const phone = document.getElementById('loginPhone').value.trim();
            const pass = document.getElementById('loginPass').value.trim();
            const usr = db.users.find(x => x.phone === phone && x.pass === pass);
            if(usr) {
                db.currentUser = phone;
                persistDB();
                document.getElementById('authContainer').classList.add('hidden');
                switchTab('home');
            } else {
                alert('মোবাইল নম্বর অথবা পাসওয়ার্ড ভুল হয়েছে!');
            }
        }

        function triggerOTP() {
            const name = document.getElementById('regName').value.trim();
            const phone = document.getElementById('regPhone').value.trim();
            const pass = document.getElementById('regPass').value.trim();
            if(!name || phone.length < 11 || pass.length < 6) {
                alert('দয়া করে সঠিক তথ্য প্রদান করুন!');
                return;
            }
            let otp = Math.floor(1000 + Math.random() * 9000);
            alert(`আপনার সিমে SMS কোড পাঠানো হয়েছে: [ OTP: ${otp} ]`);
            let entered = prompt('সিমে আসা ৪ ডিজিটের ওটিপি (OTP) কোডটি লিখুন:');
            if(entered) {
                db.users.push({
                    phone: phone, pass: pass, name: name,
                    balance: 500.00, bonus: 500.00, turnoverReq: 5000.00, turnoverDone: 0.00, verified: true
                });
                db.currentUser = phone;
                persistDB();
                document.getElementById('authContainer').classList.add('hidden');
                alert('অভিনন্দন! অ্যাকাউন্ট ভেরিফাই হয়েছে এবং আপনার অ্যাকাউন্টে ৳৫০০ ওয়েলকাম বোনাস যোগ হয়েছে!');
                switchTab('home');
            }
        }

        function executePasswordReset() {
            const phone = document.getElementById('forgotPhone').value.trim();
            const newPass = document.getElementById('newPass').value.trim();
            let usr = db.users.find(x => x.phone === phone);
            if(usr && newPass.length >= 6) {
                usr.pass = newPass;
                persistDB();
                alert('পাসওয়ার্ড সফলভাবে পরিবর্তন করা হয়েছে!');
                renderAuthScreen('login');
            } else {
                alert('নম্বর পাওয়া যায়নি অথবা পাসওয়ার্ড ছোট হয়েছে!');
            }
        }

        // --- NAVIGATION TABS ---
        function switchTab(tabName) {
            ['home', 'games', 'deposit', 'history', 'profile'].forEach(t => {
                const btn = document.getElementById(`nav-${t}`);
                if(btn) {
                    btn.classList.remove('text-amber-400');
                    btn.classList.add('text-slate-400');
                }
            });
            const activeBtn = document.getElementById(`nav-${tabName}`);
            if(activeBtn) {
                activeBtn.classList.remove('text-slate-400');
                activeBtn.classList.add('text-amber-400');
            }

            const content = document.getElementById('appContent');
            if(tabName === 'home') renderHome(content);
            else if(tabName === 'games') renderGames(content);
            else if(tabName === 'deposit') renderDeposit(content);
            else if(tabName === 'history') renderHistory(content);
            else if(tabName === 'profile') renderProfile(content);
        }

        function renderHome(container) {
            let u = db.users.find(x => x.phone === db.currentUser);
            let turnoverPercent = u ? Math.min(100, (u.turnoverDone / u.turnoverReq) * 100).toFixed(1) : 0;
            container.innerHTML = `
                <div class="space-y-4">
                    <div class="bg-gradient-to-r from-rose-600 via-purple-600 to-indigo-600 rounded-2xl p-4 shadow-xl text-white space-y-2">
                        <span class="bg-amber-400 text-slate-950 font-bold text-[10px] px-2 py-0.5 rounded-full uppercase">টার্নওভার প্রগ্রেস</span>
                        <h2 class="text-base font-bold">বোনাস উত্তোলনের শর্ত (Turnover)</h2>
                        <div class="w-full bg-slate-950/50 rounded-full h-3 overflow-hidden border border-slate-700">
                            <div class="bg-amber-400 h-full transition-all duration-300" style="width: ${turnoverPercent}%"></div>
                        </div>
                        <div class="flex justify-between text-[11px] text-slate-200">
                            <span>সম্পন্ন: ৳ ${u ? u.turnoverDone.toFixed(2) : 0}</span>
                            <span>টার্গেট: ৳ ${u ? u.turnoverReq.toFixed(2) : 5000}</span>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div onclick="openGame('Aviator')" class="bg-slate-900 border border-slate-800 rounded-xl p-3 text-center cursor-pointer hover:border-amber-500 transition shadow">
                            <div class="bg-gradient-to-br from-rose-500 to-amber-600 h-24 rounded-lg flex items-center justify-center text-white text-xl font-black mb-1">🚀 AVIATOR</div>
                            <div class="text-xs font-bold">এভিয়েটর ক্র্যাশ</div>
                        </div>
                        <div onclick="openGame('ColorTrading')" class="bg-slate-900 border border-slate-800 rounded-xl p-3 text-center cursor-pointer hover:border-amber-500 transition shadow">
                            <div class="bg-gradient-to-br from-emerald-600 to-cyan-600 h-24 rounded-lg flex items-center justify-center text-white text-xl font-black mb-1">🎨 WINGO</div>
                            <div class="text-xs font-bold">কালার ট্রেডিং</div>
                        </div>
                        <div onclick="openGame('Mines')" class="bg-slate-900 border border-slate-800 rounded-xl p-3 text-center cursor-pointer hover:border-amber-500 transition shadow">
                            <div class="bg-gradient-to-br from-purple-600 to-blue-600 h-24 rounded-lg flex items-center justify-center text-white text-xl font-black mb-1">💣 MINES</div>
                            <div class="text-xs font-bold">মাইনস ৫×৫</div>
                        </div>
                        <div onclick="openGame('Slots')" class="bg-slate-900 border border-slate-800 rounded-xl p-3 text-center cursor-pointer hover:border-amber-500 transition shadow">
                            <div class="bg-gradient-to-br from-amber-500 to-rose-600 h-24 rounded-lg flex items-center justify-center text-white text-xl font-black mb-1">🎰 SLOTS</div>
                            <div class="text-xs font-bold">মেগা ৭৭৭ স্লট</div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderGames(container) {
            const games = [
                { id: 'Aviator', name: 'এভিয়েটর ক্র্যাশ', icon: 'fa-rocket', color: 'text-rose-500' },
                { id: 'ColorTrading', name: 'কালার ট্রেডিং WinGo', icon: 'fa-palette', color: 'text-cyan-400' },
                { id: 'Mines', name: 'মাইনস ৫×৫ ট্রেজার', icon: 'fa-bomb', color: 'text-purple-400' },
                { id: 'Slots', name: 'মেগা ৭৭৭ স্লট', icon: 'fa-slot-machine', color: 'text-amber-400' },
                { id: 'Roulette', name: 'ইউরোপিয়ান রুলেট', icon: 'fa-circle-dot', color: 'text-emerald-400' },
                { id: 'Dice', name: 'ডাইস ওভার/আন্ডার', icon: 'fa-dice', color: 'text-blue-400' },
                { id: 'DragonTower', name: 'ড্রাগন টাওয়ার', icon: 'fa-chess-rook', color: 'text-rose-400' },
                { id: 'CoinFlip', name: 'কয়েন ফ্লিপ হেড/টেল', icon: 'fa-coins', color: 'text-yellow-400' },
                { id: 'Plinko', name: 'প্লিংকো বল ড্রপ', icon: 'fa-circle', color: 'text-indigo-400' },
                { id: 'Wheel', name: 'লাকি স্পিন হুইল', icon: 'fa-dharmachakra', color: 'text-teal-400' }
            ];

            container.innerHTML = `
                <div class="space-y-4">
                    <h2 class="text-base font-bold text-amber-400"><i class="fa-solid fa-gamepad"></i> সম্পূর্ণ ক্যাসিনো গেম লবি (১০+ গেমস)</h2>
                    <div class="grid grid-cols-2 gap-3">
                        ${games.map(g => `
                            <div onclick="openGame('${g.id}')" class="bg-slate-900 border border-slate-800 p-3 rounded-xl cursor-pointer hover:border-amber-500 text-center transition">
                                <div class="${g.color} text-2xl mb-1"><i class="fa-solid ${g.icon}"></i></div>
                                <div class="font-bold text-xs">${g.name}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        let aviatorInterval;
        function openGame(gameType) {
            const container = document.getElementById('appContent');
            let u = db.users.find(x => x.phone === db.currentUser);

            if(gameType === 'Aviator') {
                container.innerHTML = `
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-4">
                        <div class="flex justify-between items-center">
                            <h3 class="font-bold text-sm text-rose-500"><i class="fa-solid fa-rocket"></i> এভিয়েটর লাইভ ক্র্যাশ</h3>
                            <button onclick="switchTab('games')" class="text-xs text-slate-400">ফিরে যান</button>
                        </div>
                        <div class="bg-slate-950 h-48 rounded-xl border border-slate-800 flex flex-col items-center justify-center relative">
                            <div id="aviatorMultiplier" class="text-4xl font-black text-amber-400">1.00x</div>
                            <div id="aviatorStatus" class="text-xs text-slate-400 mt-2">বেট করার জন্য প্রস্তুত</div>
                        </div>
                        <button id="aviatorBtn" onclick="startAviator()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl text-sm shadow">বেট করুন (৳ ৫০)</button>
                    </div>
                `;
            } else {
                if(u.balance < 50) { alert('পর্যাপ্ত ব্যালেন্স নেই!'); return; }
                u.balance -= 50;
                u.turnoverDone += 50;
                let win = Math.random() > 0.45 ? 120 : 0;
                u.balance += win;
                persistDB();
                alert(win > 0 ? `অভিনন্দন! আপনি ${gameType} গেমে ৳ ১২০ জিতেছেন!` : `আপনি ${gameType} গেমে ৳ ৫০ হেরেছেন।`);
                switchTab('home');
            }
        }

        function startAviator() {
            let u = db.users.find(x => x.phone === db.currentUser);
            if(u.balance < 50) { alert('পর্যাপ্ত ব্যালেন্স নেই!'); return; }
            u.balance -= 50;
            u.turnoverDone += 50;
            persistDB();

            let mult = 1.00;
            let crashAt = 1.2 + Math.random() * 3.0;
            const multEl = document.getElementById('aviatorMultiplier');
            const statusEl = document.getElementById('aviatorStatus');
            const btn = document.getElementById('aviatorBtn');
            btn.innerText = "ক্যাশ আউট";
            btn.className = "w-full bg-amber-500 text-slate-950 font-bold py-3 rounded-xl text-sm shadow";
            let cashed = false;

            btn.onclick = function() {
                if(!cashed) {
                    cashed = true;
                    let win = 50 * mult;
                    u.balance += win;
                    persistDB();
                    statusEl.innerText = `সফল ক্যাশ আউট! জিতলেন ৳ ${win.toFixed(2)}`;
                    btn.innerText = "বেট করুন (৳ ৫০)";
                    btn.onclick = startAviator;
                    clearInterval(aviatorInterval);
                }
            };

            aviatorInterval = setInterval(() => {
                mult += 0.05;
                multEl.innerText = mult.toFixed(2) + 'x';
                if(mult >= crashAt && !cashed) {
                    clearInterval(aviatorInterval);
                    statusEl.innerText = `ক্র্যাশ হয়েছে! (${mult.toFixed(2)}x)`;
                    btn.innerText = "বেট করুন (৳ ৫০)";
                    btn.onclick = startAviator;
                    persistDB();
                }
            }, 150);
        }

        function renderDeposit(container) {
            const currentAgent = db.agentNumbers[db.agentIndex];
            container.innerHTML = `
                <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl shadow-xl space-y-4">
                    <h3 class="font-bold text-sm text-slate-200 border-b border-slate-800 pb-2">ডিপোজিট করুন (অটো রোটেটিং নম্বর)</h3>
                    <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 flex justify-between items-center">
                        <div>
                            <span class="text-[10px] text-slate-400 block">এজেন্ট পার্সোনাল নম্বর:</span>
                            <span class="font-mono text-amber-400 font-bold text-base">${currentAgent}</span>
                        </div>
                        <button onclick="navigator.clipboard.writeText('${currentAgent}'); alert('নম্বর কপি হয়েছে!');" class="bg-amber-500 text-slate-950 text-xs font-bold px-3 py-1.5 rounded">কপি</button>
                    </div>
                    <div>
                        <label class="text-xs text-slate-400 block mb-1">ট্রানজেকশন আইডি (TrxID)</label>
                        <input type="text" id="trxIdInput" placeholder="TrxID লিখুন" class="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-xs w-full outline-none text-white">
                    </div>
                    <button onclick="submitDeposit()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl text-sm shadow">জমা কনফার্ম করুন</button>
                </div>
            `;
        }

        function submitDeposit() {
            const trx = document.getElementById('trxIdInput').value.trim();
            if(!trx) { alert('TrxID লিখুন!'); return; }
            db.agentIndex = (db.agentIndex + 1) % db.agentNumbers.length;
            db.transactions.unshift({ id: trx, type: 'Deposit', amount: 1000, status: 'Pending', time: new Date().toLocaleTimeString() });
            persistDB();
            alert('ডিপোজিট রিকোয়েস্ট পেন্ডিং রয়েছে!');
            switchTab('history');
        }

        function renderHistory(container) {
            container.innerHTML = `
                <div class="space-y-4">
                    <h2 class="text-base font-bold text-amber-400"><i class="fa-solid fa-clock-rotate-left"></i> লেনদেনের ইতিহাস</h2>
                    <div class="space-y-2">
                        ${db.transactions.map(tx => `
                            <div class="bg-slate-900 border border-slate-800 p-3 rounded-xl flex justify-between items-center text-xs">
                                <div>
                                    <div class="font-bold text-slate-200">${tx.type} - ৳ ${tx.amount}</div>
                                    <div class="text-[10px] text-slate-400">Trx: ${tx.id} | ${tx.time}</div>
                                </div>
                                <span class="font-bold px-2 py-0.5 rounded text-[10px] ${tx.status==='Success'?'bg-emerald-500/10 text-emerald-400':(tx.status==='Pending'?'bg-amber-500/10 text-amber-400':'bg-rose-500/10 text-rose-400')}">${tx.status}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderProfile(container) {
            let u = db.users.find(x => x.phone === db.currentUser);
            container.innerHTML = `
                <div class="space-y-4">
                    <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl flex items-center space-x-3">
                        <div class="bg-amber-500 text-slate-950 font-black text-xl w-12 h-12 rounded-full flex items-center justify-center">MH</div>
                        <div>
                            <h3 class="font-bold text-sm text-white">${u ? u.name : 'User'}</h3>
                            <p class="text-xs text-slate-400">নম্বর: ${u ? u.phone : ''}</p>
                        </div>
                    </div>
                    <button onclick="db.currentUser=null; persistDB(); renderAuthScreen('login');" class="w-full bg-rose-950/40 border border-rose-800 py-3 rounded-xl text-xs font-semibold text-rose-400">লগ আউট করুন</button>
                </div>
            `;
        }

        // Movable Chat
        const chatWidget = document.getElementById('floatingChat');
        const chatHeader = document.getElementById('chatHeader');
        let isDragging = false, initialX, initialY;

        chatHeader.addEventListener('mousedown', dragStart);
        document.addEventListener('mouseup', dragEnd);
        document.addEventListener('mousemove', drag);

        function dragStart(e) {
            initialX = e.clientX - chatWidget.offsetLeft;
            initialY = e.clientY - chatWidget.offsetTop;
            isDragging = true;
        }
        function dragEnd() { isDragging = false; }
        function drag(e) {
            if (isDragging) {
                e.preventDefault();
                chatWidget.style.left = (e.clientX - initialX) + "px";
                chatWidget.style.top = (e.clientY - initialY) + "px";
                chatWidget.style.bottom = "auto";
                chatWidget.style.right = "auto";
            }
        }
        function toggleChatBody() {
            document.getElementById('chatBody').classList.toggle('hidden');
        }
        function sendClientMessage() {
            const txt = document.getElementById('chatInputText').value.trim();
            if(!txt) return;
            db.chatMessages.push({ sender: db.currentUser || 'Guest', text: txt });
            persistDB();
            document.getElementById('chatInputText').value = '';
            renderChatMessages();
        }
        function renderChatMessages() {
            const box = document.getElementById('chatMessages');
            const adminBox = document.getElementById('adminChatBox');
            if(box) box.innerHTML = db.chatMessages.map(m => `<div class="bg-slate-900 p-1.5 rounded text-slate-300"><b>${m.sender}:</b> ${m.text}</div>`).join('');
            if(adminBox) adminBox.innerHTML = db.chatMessages.map(m => `<div class="bg-slate-950 p-1 rounded text-slate-300"><b>${m.sender}:</b> ${m.text}</div>`).join('');
        }

        // Admin Panel
        function openAdminPanel() {
            document.getElementById('adminModal').classList.remove('hidden');
            renderAdminData();
        }
        function closeAdminPanel() { document.getElementById('adminModal').classList.add('hidden'); }
        
        function renderAdminData() {
            const uList = document.getElementById('adminUserList');
            uList.innerHTML = db.users.map((u, i) => `
                <div class="bg-slate-900 p-2 rounded flex justify-between items-center">
                    <div>
                        <div class="font-bold text-amber-400">${u.name} (${u.phone})</div>
                        <div class="text-[10px] text-slate-400">Pass: ${u.pass} | Bal: ৳${u.balance}</div>
                    </div>
                    <button onclick="adminResetPass(${i})" class="bg-rose-700 text-white px-2 py-1 rounded text-[10px]">পাসওয়ার্ড বদল</button>
                </div>
            `).join('');

            const reqList = document.getElementById('adminRequestManager');
            reqList.innerHTML = db.transactions.map((tx, i) => `
                <div class="bg-slate-900 p-2 rounded flex justify-between items-center">
                    <div>
                        <div class="font-bold text-emerald-400">${tx.type} - ৳${tx.amount} (${tx.status})</div>
                        <div class="text-[10px] text-slate-400">Trx: ${tx.id}</div>
                    </div>
                    <div class="space-x-1">
                        <button onclick="updateTx(${i}, 'Success')" class="bg-emerald-600 px-2 py-0.5 rounded text-white text-[10px]">Approve</button>
                        <button onclick="updateTx(${i}, 'Rejected')" class="bg-rose-600 px-2 py-0.5 rounded text-white text-[10px]">Reject</button>
                    </div>
                </div>
            `).join('');
            renderChatMessages();
        }

        function adminResetPass(idx) {
            let p = prompt('নতুন পাসওয়ার্ড লিখুন:');
            if(p && p.length >= 6) {
                db.users[idx].pass = p;
                persistDB();
                renderAdminData();
                alert('সফলভাবে পাসওয়ার্ড পরিবর্তন করা হয়েছে!');
            }
        }

        function updateTx(idx, status) {
            db.transactions[idx].status = status;
            if(status === 'Success' && db.transactions[idx].type === 'Deposit') {
                let u = db.users[0];
                if(u) u.balance += db.transactions[idx].amount;
            }
            persistDB();
            renderAdminData();
        }

        function adminSaveBalance() {
            const val = parseFloat(document.getElementById('adminSetBalance').value);
            if(!isNaN(val) && db.users.length > 0) {
                db.users[0].balance = val;
                persistDB();
                alert('ব্যালেন্স আপডেট করা হয়েছে!');
            }
        }

        window.onload = function() {
            if(!db.currentUser) {
                renderAuthScreen('login');
            } else {
                document.getElementById('authContainer').classList.add('hidden');
                switchTab('home');
            }
            updateHeaderBalance();
            renderChatMessages();
        };
    </script>
</body>
</html>
